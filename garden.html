<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#bbdff5">
  <meta name="description" content="Chạm một bông hoa, đánh thức cả khu vườn và nhận một lời chúc dịu dàng ngày 20/10.">
  <title>Cả một vườn thương · 20/10</title>
  <link rel="stylesheet" href="./app.css">
  <script src="./navigation.js" defer></script>
  <script src="./music.js" defer></script>
</head>
<body data-view="garden">
  <audio id="backgroundMusic" src="./assets/music/%5BLyrics%20%26%20Vietsub%5D%20ONLY%20-%20LeeHi%20%20augsn%20-%20augsn.mp3" autoplay loop preload="auto"></audio>
  <noscript><p class="app-noscript">Bật JavaScript để ngắm hoa và mở thiệp 20/10 nhé.</p></noscript>
  <dialog id="orientationPrompt" class="orientation-prompt" aria-labelledby="orientationTitle" aria-describedby="orientationDescription">
    <div class="orientation-content">
      <p class="orientation-note">Một chút nhắn nhủ ♡</p>
      <svg class="orientation-illustration" viewBox="0 0 180 150" fill="none" aria-hidden="true">
        <circle cx="90" cy="75" r="64" fill="#f8e2eb"/>
        <path d="M35 73a55 55 0 0 1 91-41m0 0-1-13m1 13-13 1M145 78a55 55 0 0 1-91 41m0 0 1 13m-1-13 13-1" stroke="#c9789a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="orientation-phone">
          <rect x="67" y="33" width="46" height="84" rx="9" fill="#fffdfb" stroke="#8c4c65" stroke-width="2.5"/>
          <path d="M82 40h16M87 109h6" stroke="#c9789a" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M90 87s-14-8-14-17a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 9-14 17-14 17Z" fill="#e7a6be"/>
        </g>
      </svg>
      <h1 id="orientationTitle">Em hãy thử quay ngang<br>điện thoại nhé</h1>
      <p id="orientationDescription">Để ngắm cả vườn hoa và những điều nhỏ xinh trọn vẹn hơn.</p>
      <button id="continuePortrait" class="orientation-continue" type="button" autofocus>Xem tiếp <span aria-hidden="true">♡</span></button>
      <p class="orientation-hint">Em vẫn có thể xem khi để dọc.</p>
    </div>
  </dialog>
  <iframe id="flowerView" name="flowerView" title="Cả một vườn thương · 20/10"></iframe>
</body>
</html>
